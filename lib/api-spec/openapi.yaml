openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Cloud project operations
  - name: storage
    description: Project media storage operations
  - name: schedule-shares
    description: Public schedule sharing operations
  - name: checklist-shares
    description: Collaborative Gameday Checklist sharing operations
  - name: hype-card-shares
    description: Interactive Hype Card sharing operations
  - name: coach-calendars
    description: Authenticated coach calendar connections
  - name: account-access
    description: Authenticated account role and Guest usage
  - name: supporter-photos
    description: Private supporter athlete photos
  - name: notifications
    description: Authenticated browser push notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /schedule-shares:
    post:
      operationId: createScheduleShare
      tags: [schedule-shares]
      summary: Create a public schedule share
      description: Creates a public snapshot containing schedule details only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleShareInput"
      responses:
        "201":
          description: Public schedule share created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /schedule-shares/{shareToken}:
    parameters:
      - $ref: "#/components/parameters/ScheduleShareToken"
    get:
      operationId: getScheduleShare
      tags: [schedule-shares]
      summary: Get a public schedule share
      description: Returns schedule details without requiring a LeagueMatrix account.
      responses:
        "200":
          description: Public schedule details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleShare"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateScheduleShare
      tags: [schedule-shares]
      summary: Update a public schedule share
      description: Updates a schedule share owned by the authenticated coach while keeping its public link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleShareInput"
      responses:
        "200":
          description: Public schedule share updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteScheduleShare
      tags: [schedule-shares]
      summary: Revoke a public schedule share
      description: Revokes a schedule share owned by the authenticated coach.
      responses:
        "204":
          description: Public schedule share revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /checklist-shares:
    post:
      operationId: createChecklistShare
      tags: [checklist-shares]
      summary: Create a collaborative Gameday Checklist share
      description: Creates an edit link owned by the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistShareInput"
      responses:
        "201":
          description: Collaborative checklist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /checklist-shares/{shareToken}:
    parameters:
      - $ref: "#/components/parameters/ChecklistShareToken"
    get:
      operationId: getChecklistShare
      tags: [checklist-shares]
      summary: Open a collaborative checklist edit link
      responses:
        "200":
          description: Current checklist contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistShare"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateChecklistShare
      tags: [checklist-shares]
      summary: Save a collaborative checklist edit
      description: Saves only when the expected revision is current.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistShareUpdate"
      responses:
        "200":
          description: Checklist updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Expected revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistConflict"
    delete:
      operationId: deleteChecklistShare
      tags: [checklist-shares]
      summary: Revoke a collaborative checklist edit link
      description: Only the checklist owner can revoke the link.
      responses:
        "204":
          description: Checklist link revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /hype-card-shares:
    get:
      operationId: listHypeCardShares
      tags: [hype-card-shares]
      summary: List owned Hype Card shares
      responses:
        "200":
          description: Owned shares, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypeCardShareList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createHypeCardShare
      tags: [hype-card-shares]
      summary: Publish a Hype Card player page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HypeCardShareInput"
      responses:
        "201":
          description: Published player page created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypeCardShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Prepared uploads are unavailable or the share being refreshed is no longer active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Prepared share media is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /hype-card-shares/upload-url:
    post:
      operationId: requestHypeCardShareUploadUrl
      tags: [hype-card-shares]
      summary: Request a private upload URL for prepared share media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HypeCardShareUploadInput"
      responses:
        "200":
          description: Presigned private upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypeCardShareUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /hype-card-shares/{shareToken}:
    parameters:
      - $ref: "#/components/parameters/HypeCardShareToken"
    get:
      operationId: getHypeCardShare
      tags: [hype-card-shares]
      summary: Get a public Hype Card player page
      responses:
        "200":
          description: Public Hype Card details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypeCardShare"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteHypeCardShare
      tags: [hype-card-shares]
      summary: Revoke an owned Hype Card share
      responses:
        "204":
          description: Share revoked and media removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /hype-card-shares/{shareToken}/media/{mediaKind}:
    parameters:
      - $ref: "#/components/parameters/HypeCardShareToken"
      - $ref: "#/components/parameters/HypeCardShareMediaKind"
    get:
      operationId: serveHypeCardShareMedia
      tags: [hype-card-shares]
      summary: Serve media for an active public Hype Card share
      responses:
        "200":
          description: Prepared clip or poster bytes
          content:
            image/*: {}
            video/*: {}
        "404":
          $ref: "#/components/responses/NotFound"
  /coach-calendar:
    get:
      operationId: getCoachCalendarCode
      tags: [coach-calendars]
      summary: Get or create the authenticated coach's calendar code
      description: Returns the stable five-character code and current private subscription-link state.
      responses:
        "200":
          description: Coach calendar code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachCalendarCode"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /coach-calendar/subscription:
    post:
      operationId: createCoachCalendarSubscription
      tags: [coach-calendars]
      summary: Create or refresh the authenticated coach's calendar subscription
      description: Issues a private tokenized feed link. Issuing a new link revokes the previous link.
      responses:
        "200":
          description: Calendar subscription link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachCalendarSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteCoachCalendarSubscription
      tags: [coach-calendars]
      summary: Revoke the authenticated coach's calendar subscription
      responses:
        "204":
          description: Calendar subscription revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /coach-calendar/subscription/{token}:
    get:
      operationId: getConnectedCoachCalendarBySubscription
      tags: [coach-calendars]
      summary: Get a connected coach calendar by private subscription token
      description: Returns the current schedule for an authenticated supporter using an active private subscription link.
      parameters:
        - $ref: "#/components/parameters/CoachCalendarSubscriptionTokenParam"
      responses:
        "200":
          description: Current coach calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachCalendar"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /coach-calendar/connect:
    post:
      operationId: connectToCoachCalendar
      tags: [coach-calendars]
      summary: Connect a fan to a coach calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachCalendarConnectInput"
      responses:
        "200":
          description: Current coach calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachCalendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /coach-calendar/feed/{token}.ics:
    get:
      operationId: getCoachCalendarFeed
      tags: [coach-calendars]
      summary: Get a private ICS calendar feed
      description: Returns the current schedule without requiring a Pixl Sports account.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{32,100}$"
      responses:
        "200":
          description: ICS calendar feed
          content:
            text/calendar:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /coach-calendar/{code}:
    get:
      operationId: getConnectedCoachCalendar
      tags: [coach-calendars]
      summary: Get the current schedule for a connected coach code
      parameters:
        - $ref: "#/components/parameters/CoachCalendarCodeParam"
      responses:
        "200":
          description: Current coach calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachCalendar"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /account/access:
    get:
      operationId: getAccountAccess
      tags: [account-access]
      summary: Get the authenticated user's account access and Guest usage
      responses:
        "200":
          description: Account access and usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateAccountAccess
      tags: [account-access]
      summary: Save the authenticated user's role and access mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAccessInput"
      responses:
        "200":
          description: Account access and usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Account mode is already set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/lifecycle:
    get:
      operationId: getAccountLifecycle
      tags: [account-access]
      summary: Get the authenticated user's account lifecycle state
      responses:
        "200":
          description: Current account lifecycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLifecycle"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /account/cancel:
    post:
      operationId: cancelAccount
      tags: [account-access]
      summary: Cancel and immediately lock the authenticated account
      responses:
        "200":
          description: Cancelled account lifecycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLifecycle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Account setup is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/reactivate:
    post:
      operationId: reactivateAccount
      tags: [account-access]
      summary: Reactivate an account during its recovery window
      responses:
        "200":
          description: Reactivated account lifecycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLifecycle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: Recovery window has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /billing/webhook:
    post:
      operationId: receiveBillingWebhook
      tags: [account-access]
      summary: Apply a verified paid entitlement to an account
      description: Receives a signed paid entitlement event and restores an eligible cancelled account. Duplicate provider event IDs are acknowledged without repeating the transition.
      parameters:
        - in: header
          name: x-billing-signature
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature of the raw request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaidEntitlementEvent"
      responses:
        "200":
          description: Entitlement accepted or safely replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingWebhookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /account/usage:
    post:
      operationId: consumeAccountUsage
      tags: [account-access]
      summary: Consume one Guest allowance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUsageConsumeInput"
      responses:
        "200":
          description: Updated account access and usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Guest allowance exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the authenticated user's projects
      responses:
        "200":
          description: Projects owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a cloud project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Project limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [projects]
      summary: Get one owned cloud project
      responses:
        "200":
          description: Owned project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update an owned cloud project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Expected revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConflict"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete an owned cloud project and its media metadata
      responses:
        "204":
          description: Project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /storage/uploads/request-url:
    post:
      operationId: requestProjectMediaUploadUrl
      tags: [storage]
      summary: Request a private project media upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Presigned direct upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Upload is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: An active paid entitlement is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/uploads/complete:
    post:
      operationId: completeProjectMediaUpload
      tags: [storage]
      summary: Validate and save a prepared project media upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadCompleteInput"
      responses:
        "201":
          description: Saved project media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Upload claim expired or quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Uploaded media is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      operationId: serveProjectMedia
      tags: [storage]
      summary: Serve owned project media
      responses:
        "200":
          description: Media bytes
          content:
            image/*: {}
            video/*: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProjectMedia
      tags: [storage]
      summary: Delete owned project media
      responses:
        "204":
          description: Media deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /supporter-photo:
    get:
      operationId: getSupporterPhoto
      tags: [supporter-photos]
      summary: Get the signed-in supporter's athlete photo
      responses:
        "200":
          description: Current private athlete photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupporterPhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: saveSupporterPhoto
      tags: [supporter-photos]
      summary: Validate and save an uploaded athlete photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupporterPhotoSave"
      responses:
        "200":
          description: Saved private athlete photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupporterPhoto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: Photo is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSupporterPhoto
      tags: [supporter-photos]
      summary: Remove the signed-in supporter's athlete photo
      responses:
        "204":
          description: Photo removed
  /supporter-photo/upload-url:
    post:
      operationId: requestSupporterPhotoUploadUrl
      tags: [supporter-photos]
      summary: Request a private athlete photo upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupporterPhotoUploadInput"
      responses:
        "200":
          description: Presigned private upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupporterPhotoUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
  /notifications/config:
    get:
      operationId: getNotificationConfig
      tags: [notifications]
      summary: Get browser push notification availability
      responses:
        "200":
          description: Push configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/subscriptions:
    post:
      operationId: saveNotificationSubscription
      tags: [notifications]
      summary: Register a browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSubscriptionInput"
      responses:
        "204":
          description: Subscription saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Subscription belongs to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteNotificationSubscription
      tags: [notifications]
      summary: Remove a browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSubscriptionDeleteInput"
      responses:
        "204":
          description: Subscription removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/subscriptions/status:
    get:
      operationId: getNotificationSubscriptionStatus
      tags: [notifications]
      summary: Check ownership of a browser push subscription
      parameters:
        - name: endpoint
          in: query
          required: true
          schema:
            type: string
            format: uri
            maxLength: 2048
      responses:
        "200":
          description: Subscription ownership status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSubscriptionStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/test:
    post:
      operationId: sendTestNotification
      tags: [notifications]
      summary: Send a test notification
      responses:
        "202":
          description: Test notification queued
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Push notifications are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No live subscription received the notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChecklistShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CoachCalendarCodeParam:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Z2-9]{5}$"
    CoachCalendarSubscriptionTokenParam:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{32,100}$"
    HypeCardShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{24,80}$"
    HypeCardShareMediaKind:
      name: mediaKind
      in: path
      required: true
      schema:
        type: string
        enum: [video, poster]
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SupporterPhoto:
      type: object
      required: [url, contentType, size, cropX, cropY, cropZoom, updatedAt]
      properties:
        url: { type: string }
        contentType: { type: string }
        size: { type: integer, minimum: 1 }
        cropX: { type: integer, minimum: 0, maximum: 100 }
        cropY: { type: integer, minimum: 0, maximum: 100 }
        cropZoom: { type: integer, minimum: 100, maximum: 250 }
        updatedAt: { type: string, format: date-time }
    SupporterPhotoUploadInput:
      type: object
      required: [contentType, size]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
    SupporterPhotoUpload:
      type: object
      required: [uploadUrl, objectPath]
      properties:
        uploadUrl: { type: string, format: uri }
        objectPath: { type: string }
    SupporterPhotoSave:
      type: object
      required: [objectPath, cropX, cropY, cropZoom]
      properties:
        objectPath: { type: string, minLength: 10 }
        cropX: { type: integer, minimum: 0, maximum: 100 }
        cropY: { type: integer, minimum: 0, maximum: 100 }
        cropZoom: { type: integer, minimum: 100, maximum: 250 }
    NotificationConfig:
      type: object
      required: [available, publicKey]
      properties:
        available: { type: boolean }
        publicKey: { type: ["string", "null"], maxLength: 300 }
    NotificationSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 1, maxLength: 300 }
            auth: { type: string, minLength: 1, maxLength: 300 }
    NotificationSubscriptionDeleteInput:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
    NotificationSubscriptionStatus:
      type: object
      required: [owned, ownedByAnotherAccount]
      properties:
        owned: { type: boolean }
        ownedByAnotherAccount: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ScheduleEvent:
      type: object
      required: [id, type, date, time, location, opponent, snacks, drinks, notes]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [game, practice, meeting] }
        date: { type: string, maxLength: 30 }
        time: { type: string, maxLength: 30 }
        location: { type: string, maxLength: 300 }
        opponent: { type: string, maxLength: 200 }
        snacks: { type: string, maxLength: 300 }
        drinks: { type: string, maxLength: 300 }
        notes: { type: string, maxLength: 1000 }
    ScheduleShareInput:
      type: object
      required: [title, teamSeason, events]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        teamSeason: { type: string, maxLength: 200 }
        events:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ScheduleEvent"
    ScheduleShare:
      type: object
      required: [shareToken, title, teamSeason, events, createdAt]
      properties:
        shareToken:
          type: string
          format: uuid
        title: { type: string }
        teamSeason: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEvent"
        createdAt:
          type: string
          format: date-time
    ChecklistItem:
      type: object
      required: [id, label, completed]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        label: { type: string, minLength: 1, maxLength: 240 }
        completed: { type: boolean }
        section:
          type: ["string", "null"]
          maxLength: 100
    ChecklistGame:
      type: object
      required: [id, date, time, location, opponent]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        date: { type: string, maxLength: 20 }
        time: { type: string, maxLength: 20 }
        location: { type: string, maxLength: 240 }
        opponent: { type: string, maxLength: 240 }
    ChecklistShareInput:
      type: object
      required: [title, mode, items]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        mode: { type: string, enum: [gameday, tournament] }
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChecklistItem"
        selectedGame:
          type: ["object", "null"]
          allOf:
            - $ref: "#/components/schemas/ChecklistGame"
    ChecklistShareUpdate:
      allOf:
        - $ref: "#/components/schemas/ChecklistShareInput"
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision: { type: integer, minimum: 1 }
    ChecklistShare:
      allOf:
        - $ref: "#/components/schemas/ChecklistShareInput"
        - type: object
          required: [shareToken, revision, createdAt, updatedAt, canManage]
          properties:
            shareToken: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            canManage: { type: boolean }
    ChecklistConflict:
      type: object
      required: [error, current]
      properties:
        error: { type: string }
        current:
          $ref: "#/components/schemas/ChecklistShare"
    HypeCardShareUploadInput:
      type: object
      required: [mediaKind, contentType]
      properties:
        mediaKind:
          type: string
          enum: [video, image, poster]
        contentType:
          type: string
          enum: [video/mp4, video/webm, image/jpeg, image/png]
    HypeCardShareUpload:
      type: object
      required: [uploadUrl, objectPath, claimId, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
        objectPath:
          type: string
        claimId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    HypeCardShareInput:
      type: object
      required: [title, slug, manifest, mediaType, mediaUploadClaimId]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        manifest:
          type: object
          additionalProperties: true
        shareKey:
          type: string
          minLength: 1
          maxLength: 200
        mediaType:
          type: string
          enum: [image, video]
        mediaUploadClaimId:
          type: string
          format: uuid
        posterUploadClaimId:
          type: ["string", "null"]
          format: uuid
        trackerProjectId:
          type: ["string", "null"]
          format: uuid
        athleteName:
          type: ["string", "null"]
          maxLength: 100
        sport:
          type: ["string", "null"]
          enum: [baseball, basketball, football, soccer, volleyball, null]
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        replaceShareToken:
          type: ["string", "null"]
          pattern: "^[A-Za-z0-9_-]{24,80}$"
    HypeCardShareStats:
      type: object
      required: [athleteName, sport, gamesPlayed, score, stats, updatedAt]
      properties:
        athleteName:
          type: string
        sport:
          type: string
          enum: [baseball, basketball, football, soccer, volleyball]
        gamesPlayed:
          type: integer
          minimum: 0
        score:
          type: integer
          minimum: 0
        stats:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        updatedAt:
          type: string
          format: date-time
    HypeCardShare:
      type: object
      required: [shareToken, slug, title, manifest, mediaType, mediaUrl, videoUrl, posterUrl, stats, expiresAt, createdAt]
      properties:
        shareToken:
          type: string
        slug:
          type: string
        title:
          type: string
        manifest:
          type: object
          additionalProperties: true
        mediaType:
          type: string
          enum: [image, video]
        mediaUrl:
          type: string
        videoUrl:
          type: ["string", "null"]
        posterUrl:
          type: string
        stats:
          anyOf:
            - $ref: "#/components/schemas/HypeCardShareStats"
            - type: "null"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    OwnedHypeCardShare:
      allOf:
        - $ref: "#/components/schemas/HypeCardShare"
        - type: object
          required: [trackerProjectId, athleteName, sport, expiresInDays]
          properties:
            trackerProjectId:
              type: ["string", "null"]
              format: uuid
            athleteName:
              type: ["string", "null"]
            sport:
              type: ["string", "null"]
              enum: [baseball, basketball, football, soccer, volleyball, null]
            expiresInDays:
              type: integer
              minimum: 1
              maximum: 365
    HypeCardShareList:
      type: array
      items:
        $ref: "#/components/schemas/OwnedHypeCardShare"
    CoachCalendarCode:
      type: object
      required: [code, subscriptionFeedPath]
      properties:
        code:
          type: string
          pattern: "^[A-Z2-9]{5}$"
        subscriptionFeedPath:
          type: ["string", "null"]
    CoachCalendarSubscription:
      type: object
      required: [feedPath]
      properties:
        feedPath:
          type: string
    CoachCalendarConnectInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 5
          maxLength: 5
          pattern: "^[A-Za-z2-9]{5}$"
    CoachCalendar:
      type: object
      required: [code, title, teamSeason, events, scheduleAvailable, updatedAt]
      properties:
        code:
          type: string
          pattern: "^[A-Z2-9]{5}$"
        title: { type: string }
        teamSeason: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEvent"
        scheduleAvailable: { type: boolean }
        updatedAt:
          type: ["string", "null"]
          format: date-time
    AccountAccessInput:
      type: object
      required: [role, accessMode]
      properties:
        role: { type: string, enum: [coach, fan] }
        accessMode: { type: string, enum: [full, guest] }
    AccountUsageConsumeInput:
      type: object
      required: [category, usageKey]
      properties:
        category: { type: string, enum: [hype_card, schedule_event, lineup] }
        usageKey: { type: string, minLength: 1, maxLength: 120 }
    AccountUsage:
      type: object
      required: [hypeCards, scheduleEvents, lineups]
      properties:
        hypeCards: { type: integer, minimum: 0 }
        scheduleEvents: { type: integer, minimum: 0 }
        lineups: { type: integer, minimum: 0 }
    PaidEntitlementEvent:
      type: object
      required: [type, id, ownerClerkUserId, paid, expiresAt]
      properties:
        type: { type: string, enum: [paid_entitlement] }
        id: { type: string, minLength: 1, maxLength: 200 }
        ownerClerkUserId: { type: string, minLength: 1, maxLength: 200 }
        paid: { type: boolean, const: true }
        expiresAt: { type: string, format: date-time }
    BillingWebhookResponse:
      type: object
      required: [ok, replayed, restored, status]
      properties:
        ok: { type: boolean }
        replayed: { type: boolean }
        restored: { type: boolean }
        status:
          type: ["string", "null"]
          enum: [active, cancelled, deletion_pending, null]
    AccountUsageRemaining:
      type: object
      required: [hypeCards, scheduleEvents, lineups]
      properties:
        hypeCards: { type: integer, minimum: 0 }
        scheduleEvents: { type: integer, minimum: 0 }
        lineups: { type: integer, minimum: 0 }
    AccountAccess:
      type: object
      required: [accessMode, role, usage, remaining, limits, paid, storage]
      properties:
        accessMode: { type: string, enum: [full, guest] }
        role:
          type: ["string", "null"]
          enum: [coach, fan, null]
        usage:
          $ref: "#/components/schemas/AccountUsage"
        remaining:
          $ref: "#/components/schemas/AccountUsageRemaining"
        limits:
          $ref: "#/components/schemas/AccountUsage"
        paid: { type: boolean }
        storage:
          $ref: "#/components/schemas/StorageQuota"
    StorageQuota:
      type: object
      required: [usedBytes, limitBytes]
      properties:
        usedBytes: { type: integer, minimum: 0 }
        limitBytes: { type: integer, minimum: 1 }
    AccountLifecycle:
      type: object
      required: [status, cancelledAt, lastActivityAt, deletionEligibleAt, retentionDays, expired]
      properties:
        status:
          type: string
          enum: [active, cancelled, deletion_pending]
        cancelledAt:
          type: ["string", "null"]
          format: date-time
        lastActivityAt:
          type: ["string", "null"]
          format: date-time
        deletionEligibleAt:
          type: ["string", "null"]
          format: date-time
        retentionDays:
          type: integer
          minimum: 1
        expired:
          type: boolean
    HypeCardProject:
      type: object
      description: HypeCardProject document. Version 2 is currently supported. New cloud writes force mediaType, mediaId, videoMeta, photo, and logo to null; non-null values remain readable for legacy projects.
      required: [version, headline, mediaType, mediaId, videoMeta, trimStart, trimEnd, template, layout, format, palette, finish, background, overlay, branding, playerName, jerseyNumber, teamName, position, grade, stat, achievement, coachMessage, visibility, photo, logo, photoTransform, adjustments]
      properties:
        version:
          type: integer
          enum: [2]
        headline: { type: string }
        mediaType: { type: ["string", "null"], enum: [image, video, null] }
        mediaId: { type: ["string", "null"] }
        videoMeta:
          oneOf:
            - $ref: "#/components/schemas/VideoMeta"
            - type: "null"
        trimStart: { type: number, minimum: 0 }
        trimEnd: { type: number, minimum: 0 }
        template: { type: string, enum: [spotlight, impact, clean] }
        layout: { type: string, enum: [slugger, all-star, rookie, dugout] }
        format: { type: string, enum: [square, story, landscape, card] }
        palette: { type: string, enum: [coral, teal, gold, midnight] }
        finish: { type: string, enum: [classic, cosmic-clash, gold-spotlight, neon-prism, paint-impact] }
        background: { type: string, enum: [solid, gradient, paper] }
        overlay: { type: boolean }
        branding: { type: boolean }
        playerName: { type: string }
        jerseyNumber: { type: string }
        teamName: { type: string }
        position: { type: string }
        grade: { type: string }
        stat: { type: string }
        achievement: { type: string }
        coachMessage: { type: string }
        visibility:
          $ref: "#/components/schemas/ProjectVisibility"
        photo: { type: ["string", "null"] }
        logo: { type: ["string", "null"] }
        photoTransform:
          $ref: "#/components/schemas/PhotoTransform"
        adjustments:
          $ref: "#/components/schemas/ProjectAdjustments"
    VideoMeta:
      type: object
      required: [name, type, size, duration]
      properties:
        name: { type: string }
        type: { type: string }
        size: { type: number }
        duration: { type: number }
    ProjectVisibility:
      type: object
      required: [grade, stat, achievement, coachMessage]
      properties:
        grade: { type: boolean }
        stat: { type: boolean }
        achievement: { type: boolean }
        coachMessage: { type: boolean }
    PhotoTransform:
      type: object
      required: [zoom, x, y, rotation, flip]
      properties:
        zoom: { type: number }
        x: { type: number }
        y: { type: number }
        rotation: { type: number }
        flip: { type: boolean }
    ProjectAdjustments:
      type: object
      required: [brightness, contrast, saturation]
      properties:
        brightness: { type: number }
        contrast: { type: number }
        saturation: { type: number }
    Project:
      type: object
      required: [id, name, project, revision, createdAt, updatedAt, media]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project:
          type: object
          additionalProperties: true
          description: Tool-specific project data. The tool field identifies the editor that owns the payload.
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        media:
          type: array
          items:
            $ref: "#/components/schemas/Media"
    ProjectList:
      type: array
      items:
        $ref: "#/components/schemas/Project"
    ProjectInput:
      type: object
      required: [name, project]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        project:
          type: object
          additionalProperties: true
        guestUsageKey:
          type: string
          minLength: 1
          maxLength: 120
    ProjectUpdate:
      type: object
      required: [expectedRevision]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        project:
          type: object
          additionalProperties: true
        expectedRevision:
          type: integer
          minimum: 1
    ProjectConflict:
      type: object
      required: [error, current]
      properties:
        error:
          type: string
        current:
          $ref: "#/components/schemas/Project"
    Media:
      type: object
      required: [id, name, contentType, size, mediaType, mediaRole, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
          minimum: 1
        mediaType:
          type: string
          enum: [image, video]
        mediaRole:
          type: string
          enum: [photo, logo, poster, video_preview, video_download, legacy]
        createdAt:
          type: string
          format: date-time
    MediaUploadInput:
      type: object
      required: [name, size, contentType, mediaType, mediaRole]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
        mediaType:
          type: string
          enum: [image, video]
        mediaRole:
          type: string
          enum: [photo, logo, poster, video_preview, video_download]
    MediaUpload:
      type: object
      required: [uploadURL, objectPath, claimId, expiresAt]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        claimId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        media:
          $ref: "#/components/schemas/Media"
    MediaUploadCompleteInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, minLength: 10 }

