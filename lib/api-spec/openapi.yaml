openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Cloud project operations
  - name: storage
    description: Project media storage operations
  - name: schedule-shares
    description: Public schedule sharing operations
  - name: checklist-shares
    description: Collaborative Gameday Checklist sharing operations
  - name: stat-tracker-shares
    description: Live stat tracker spectator sharing operations
  - name: hype-card-shares
    description: Interactive Hype Card sharing operations
  - name: athlete-invites
    description: Durable Athlete Hype Page sharing operations
  - name: account-access
    description: Authenticated account role and Guest usage
  - name: supporter-photos
    description: Private supporter athlete photos
  - name: notifications
    description: Authenticated browser push notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /schedule-shares:
    post:
      operationId: createScheduleShare
      tags: [schedule-shares]
      summary: Create a public schedule share
      description: Creates a public snapshot containing schedule details only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleShareInput"
      responses:
        "201":
          description: Public schedule share created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /schedule-shares/{shareToken}:
    parameters:
      - $ref: "#/components/parameters/ScheduleShareToken"
    get:
      operationId: getScheduleShare
      tags: [schedule-shares]
      summary: Get a public schedule share
      description: Returns schedule details without requiring a LeagueMatrix account.
      responses:
        "200":
          description: Public schedule details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleShare"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateScheduleShare
      tags: [schedule-shares]
      summary: Update a public schedule share
      description: Updates a schedule share owned by the authenticated account while keeping its public link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleShareInput"
      responses:
        "200":
          description: Public schedule share updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteScheduleShare
      tags: [schedule-shares]
      summary: Revoke a public schedule share
      description: Revokes a schedule share owned by the authenticated account.
      responses:
        "204":
          description: Public schedule share revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /checklist-shares:
    post:
      operationId: createChecklistShare
      tags: [checklist-shares]
      summary: Create a collaborative Gameday Checklist share
      description: Creates an edit link owned by the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistShareInput"
      responses:
        "201":
          description: Collaborative checklist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /checklist-shares/{shareToken}:
    parameters:
      - $ref: "#/components/parameters/ChecklistShareToken"
    get:
      operationId: getChecklistShare
      tags: [checklist-shares]
      summary: Open a collaborative checklist edit link
      responses:
        "200":
          description: Current checklist contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistShare"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateChecklistShare
      tags: [checklist-shares]
      summary: Save a collaborative checklist edit
      description: Saves only when the expected revision is current.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistShareUpdate"
      responses:
        "200":
          description: Checklist updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Expected revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistConflict"
    delete:
      operationId: deleteChecklistShare
      tags: [checklist-shares]
      summary: Revoke a collaborative checklist edit link
      description: Only the checklist owner can revoke the link.
      responses:
        "204":
          description: Checklist link revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /stat-tracker-shares:
    get:
      operationId: listStatTrackerShares
      tags: [stat-tracker-shares]
      summary: List active stat tracker shares owned by the authenticated user
      responses:
        "200":
          description: Active owned shares, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatTrackerShare"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createStatTrackerShare
      tags: [stat-tracker-shares]
      summary: Create a live stat tracker spectator share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatTrackerShareInput"
      responses:
        "201":
          description: Live spectator share created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatTrackerShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stat-tracker-shares/{shareToken}:
    parameters:
      - $ref: "#/components/parameters/StatTrackerShareToken"
    get:
      operationId: getStatTrackerShare
      tags: [stat-tracker-shares]
      summary: Get a live stat tracker spectator share
      responses:
        "200":
          description: Sanitized live game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatTrackerShare"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateStatTrackerShare
      tags: [stat-tracker-shares]
      summary: Update a live stat tracker spectator share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatTrackerShareUpdate"
      responses:
        "200":
          description: Updated live spectator share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatTrackerShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Expected revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatTrackerConflict"
    delete:
      operationId: deleteStatTrackerShare
      tags: [stat-tracker-shares]
      summary: Revoke a live stat tracker spectator share
      responses:
        "204":
          description: Spectator link revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /stat-tracker-shares/{shareToken}/events:
    parameters:
      - $ref: "#/components/parameters/StatTrackerShareToken"
    get:
      operationId: getStatTrackerShareEvents
      tags: [stat-tracker-shares]
      summary: Subscribe to live stat tracker updates
      responses:
        "200":
          description: Server-sent spectator updates
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites:
    get:
      operationId: listAthleteInvites
      tags: [athlete-invites]
      summary: List athlete invites owned by the authenticated user
      responses:
        "200":
          description: Owned athlete invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedAthleteInviteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAthleteInvite
      tags: [athlete-invites]
      summary: Create an Athlete Hype Page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteInviteInput"
      responses:
        "201":
          description: Athlete invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedAthleteInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: This account already has an athlete invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /athlete-invites/{inviteToken}:
    parameters:
      - in: path
        name: inviteToken
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{24,80}$"
    get:
      operationId: getAthleteInvite
      tags: [athlete-invites]
      summary: Get a public Athlete Hype Page
      responses:
        "200":
          description: Current public athlete page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAthleteInvite"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAthleteInvite
      tags: [athlete-invites]
      summary: Update an owned Athlete Hype Page without changing its URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteInviteInput"
      responses:
        "200":
          description: Athlete invite updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedAthleteInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAthleteInvite
      tags: [athlete-invites]
      summary: Pause an owned Athlete Hype Page
      description: Pauses the page without changing its stable URL. The page can be resumed with the update operation.
      responses:
        "204":
          description: Athlete invite revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites/{inviteToken}/live:
    parameters:
      - in: path
        name: inviteToken
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{24,80}$"
    post:
      operationId: startAthleteInviteLive
      tags: [athlete-invites]
      summary: Start a short-lived Game Day Live session for an Athlete Hype Page
      responses:
        "201":
          description: Short-lived live session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteInviteLiveSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No live game is available in the selected tracker project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: stopAthleteInviteLive
      tags: [athlete-invites]
      summary: Stop Game Day Live for an Athlete Hype Page
      responses:
        "204":
          description: Live session stopped
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /hype-card-shares:
    get:
      operationId: listHypeCardShares
      tags: [hype-card-shares]
      summary: List owned Hype Card shares
      parameters:
        - in: query
          name: shareMode
          schema:
            type: string
            enum: [card, stats]
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [image, video]
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Owned shares, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypeCardShareList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createHypeCardShare
      tags: [hype-card-shares]
      summary: Publish a Hype Card player page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HypeCardShareInput"
      responses:
        "201":
          description: Published player page created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypeCardShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Prepared uploads are unavailable or the share being refreshed is no longer active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Prepared share media is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /hype-card-shares/upload-url:
    post:
      operationId: requestHypeCardShareUploadUrl
      tags: [hype-card-shares]
      summary: Request a private upload URL for prepared share media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HypeCardShareUploadInput"
      responses:
        "200":
          description: Presigned private upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypeCardShareUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /hype-card-shares/{shareToken}:
    parameters:
      - $ref: "#/components/parameters/HypeCardShareToken"
    get:
      operationId: getHypeCardShare
      tags: [hype-card-shares]
      summary: Get a public Hype Card player page
      responses:
        "200":
          description: Public Hype Card details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypeCardShare"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteHypeCardShare
      tags: [hype-card-shares]
      summary: Revoke an owned Hype Card share
      responses:
        "204":
          description: Share revoked and media removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /hype-card-shares/{shareToken}/download:
    parameters:
      - $ref: "#/components/parameters/HypeCardShareToken"
    get:
      operationId: downloadHypeCardShare
      tags: [hype-card-shares]
      summary: Download the hosted media for an owned Hype Card share
      responses:
        "200":
          description: Hosted Hype Card image or prepared video attachment
          content:
            image/*: {}
            video/*: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /hype-card-shares/reply-inbox:
    get:
      operationId: getHypeCardReplyInbox
      tags: [hype-card-shares]
      summary: Get replies grouped by owned Hype Card share
      responses:
        "200":
          description: Replies grouped by recent sent Hype Cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypeCardReplyInbox"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: markHypeCardReplyInboxRead
      tags: [hype-card-shares]
      summary: Mark all replies for recent owned Hype Card shares as read
      responses:
        "204":
          description: Reply inbox marked read
        "401":
          $ref: "#/components/responses/Unauthorized"
  /hype-card-shares/{shareToken}/replies:
    parameters:
      - $ref: "#/components/parameters/HypeCardShareToken"
    post:
      operationId: createHypeCardShareReply
      tags: [hype-card-shares]
      summary: Reply to an active public Hype Card share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HypeCardShareReplyInput"
      responses:
        "201":
          description: Reply accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypeCardShareReplyReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listHypeCardShareReplies
      tags: [hype-card-shares]
      summary: List replies for an owned Hype Card share
      responses:
        "200":
          description: Replies, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypeCardShareReplyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: markHypeCardShareRepliesRead
      tags: [hype-card-shares]
      summary: Mark all replies for an owned Hype Card share as read
      responses:
        "204":
          description: Replies marked read
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /hype-card-shares/{shareToken}/replies/{replyId}:
    parameters:
      - $ref: "#/components/parameters/HypeCardShareToken"
      - $ref: "#/components/parameters/HypeCardShareReplyId"
    delete:
      operationId: deleteHypeCardShareReply
      tags: [hype-card-shares]
      summary: Delete one reply from an owned Hype Card share
      description: Deletes the reply only when its share belongs to the authenticated user.
      responses:
        "204":
          description: Reply deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /hype-card-shares/{shareToken}/media/{mediaKind}:
    parameters:
      - $ref: "#/components/parameters/HypeCardShareToken"
      - $ref: "#/components/parameters/HypeCardShareMediaKind"
    get:
      operationId: serveHypeCardShareMedia
      tags: [hype-card-shares]
      summary: Serve media for an active public Hype Card share
      responses:
        "200":
          description: Prepared clip or poster bytes
          content:
            image/*: {}
            video/*: {}
        "404":
          $ref: "#/components/responses/NotFound"
  /account/access:
    get:
      operationId: getAccountAccess
      tags: [account-access]
      summary: Get the authenticated user's account access and Guest usage
      responses:
        "200":
          description: Account access and usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateAccountAccess
      tags: [account-access]
      summary: Save the authenticated user's role and access mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAccessInput"
      responses:
        "200":
          description: Account access and usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Account mode is already set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/lifecycle:
    get:
      operationId: getAccountLifecycle
      tags: [account-access]
      summary: Get the authenticated user's account lifecycle state
      responses:
        "200":
          description: Current account lifecycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLifecycle"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /account/cancel:
    post:
      operationId: cancelAccount
      tags: [account-access]
      summary: Cancel and immediately lock the authenticated account
      responses:
        "200":
          description: Cancelled account lifecycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLifecycle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Account setup is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/reactivate:
    post:
      operationId: reactivateAccount
      tags: [account-access]
      summary: Reactivate an account during its recovery window
      responses:
        "200":
          description: Reactivated account lifecycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLifecycle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: Recovery window has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /billing/webhook:
    post:
      operationId: receiveBillingWebhook
      tags: [account-access]
      summary: Apply a verified paid entitlement to an account
      description: Receives a signed paid entitlement event and restores an eligible cancelled account. Duplicate provider event IDs are acknowledged without repeating the transition.
      parameters:
        - in: header
          name: x-billing-signature
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature of the raw request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaidEntitlementEvent"
      responses:
        "200":
          description: Entitlement accepted or safely replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingWebhookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /account/usage:
    post:
      operationId: consumeAccountUsage
      tags: [account-access]
      summary: Consume one Guest allowance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUsageConsumeInput"
      responses:
        "200":
          description: Updated account access and usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Guest allowance exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the authenticated user's projects
      responses:
        "200":
          description: Projects owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a cloud project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Project limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [projects]
      summary: Get one owned cloud project
      responses:
        "200":
          description: Owned project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update an owned cloud project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Expected revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConflict"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete an owned cloud project and its media metadata
      responses:
        "204":
          description: Project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /storage/uploads/request-url:
    post:
      operationId: requestProjectMediaUploadUrl
      tags: [storage]
      summary: Request a private project media upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Presigned direct upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Upload is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: An active paid entitlement is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/uploads/complete:
    post:
      operationId: completeProjectMediaUpload
      tags: [storage]
      summary: Validate and save a prepared project media upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadCompleteInput"
      responses:
        "201":
          description: Saved project media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Upload claim expired or quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Uploaded media is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/uploads/{claimId}:
    parameters:
      - $ref: "#/components/parameters/MediaUploadClaimId"
    delete:
      operationId: abandonProjectMediaUpload
      tags: [storage]
      summary: Abandon an unfinished project media upload
      responses:
        "204":
          description: Upload claim and object removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Upload is already attached to project media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Upload object could not be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      operationId: serveProjectMedia
      tags: [storage]
      summary: Serve owned project media
      responses:
        "200":
          description: Media bytes
          content:
            image/*: {}
            video/*: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProjectMedia
      tags: [storage]
      summary: Delete owned project media
      responses:
        "204":
          description: Media deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /supporter-photo:
    get:
      operationId: getSupporterPhoto
      tags: [supporter-photos]
      summary: Get the signed-in supporter's athlete photo
      responses:
        "200":
          description: Current private athlete photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupporterPhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: saveSupporterPhoto
      tags: [supporter-photos]
      summary: Validate and save an uploaded athlete photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupporterPhotoSave"
      responses:
        "200":
          description: Saved private athlete photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupporterPhoto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: Photo is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSupporterPhoto
      tags: [supporter-photos]
      summary: Remove the signed-in supporter's athlete photo
      responses:
        "204":
          description: Photo removed
  /supporter-photo/upload-url:
    post:
      operationId: requestSupporterPhotoUploadUrl
      tags: [supporter-photos]
      summary: Request a private athlete photo upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupporterPhotoUploadInput"
      responses:
        "200":
          description: Presigned private upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupporterPhotoUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
  /notifications/config:
    get:
      operationId: getNotificationConfig
      tags: [notifications]
      summary: Get browser push notification availability
      responses:
        "200":
          description: Push configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/subscriptions:
    post:
      operationId: saveNotificationSubscription
      tags: [notifications]
      summary: Register a browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSubscriptionInput"
      responses:
        "204":
          description: Subscription saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Subscription belongs to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteNotificationSubscription
      tags: [notifications]
      summary: Remove a browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSubscriptionDeleteInput"
      responses:
        "204":
          description: Subscription removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/subscriptions/status:
    get:
      operationId: getNotificationSubscriptionStatus
      tags: [notifications]
      summary: Check ownership of a browser push subscription
      parameters:
        - name: endpoint
          in: query
          required: true
          schema:
            type: string
            format: uri
            maxLength: 2048
      responses:
        "200":
          description: Subscription ownership status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSubscriptionStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/test:
    post:
      operationId: sendTestNotification
      tags: [notifications]
      summary: Send a test notification
      responses:
        "202":
          description: Test notification queued
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Push notifications are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No live subscription received the notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaUploadClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChecklistShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StatTrackerShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HypeCardShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{24,80}$"
    HypeCardShareReplyId:
      name: replyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HypeCardShareMediaKind:
      name: mediaKind
      in: path
      required: true
      schema:
        type: string
        enum: [video, poster]
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SupporterPhoto:
      type: object
      required: [url, contentType, size, cropX, cropY, cropZoom, updatedAt]
      properties:
        url: { type: string }
        contentType: { type: string }
        size: { type: integer, minimum: 1 }
        cropX: { type: integer, minimum: 0, maximum: 100 }
        cropY: { type: integer, minimum: 0, maximum: 100 }
        cropZoom: { type: integer, minimum: 100, maximum: 250 }
        updatedAt: { type: string, format: date-time }
    SupporterPhotoUploadInput:
      type: object
      required: [contentType, size]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
    SupporterPhotoUpload:
      type: object
      required: [uploadUrl, objectPath]
      properties:
        uploadUrl: { type: string, format: uri }
        objectPath: { type: string }
    SupporterPhotoSave:
      type: object
      required: [objectPath, cropX, cropY, cropZoom]
      properties:
        objectPath: { type: string, minLength: 10 }
        cropX: { type: integer, minimum: 0, maximum: 100 }
        cropY: { type: integer, minimum: 0, maximum: 100 }
        cropZoom: { type: integer, minimum: 100, maximum: 250 }
    NotificationConfig:
      type: object
      required: [available, publicKey]
      properties:
        available: { type: boolean }
        publicKey: { type: ["string", "null"], maxLength: 300 }
    NotificationSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 1, maxLength: 300 }
            auth: { type: string, minLength: 1, maxLength: 300 }
    NotificationSubscriptionDeleteInput:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
    NotificationSubscriptionStatus:
      type: object
      required: [owned, ownedByAnotherAccount]
      properties:
        owned: { type: boolean }
        ownedByAnotherAccount: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ScheduleEvent:
      type: object
      required: [id, type, date, time, location, opponent, snacks, drinks, notes]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [game, practice, meeting] }
        status: { type: string, enum: [upcoming, live, final] }
        date: { type: string, maxLength: 30 }
        time: { type: string, maxLength: 30 }
        location: { type: string, maxLength: 300 }
        opponent: { type: string, maxLength: 200 }
        snacks: { type: string, maxLength: 300 }
        drinks: { type: string, maxLength: 300 }
        notes: { type: string, maxLength: 1000 }
    ScheduleShareInput:
      type: object
      required: [title, teamSeason, events]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        teamSeason: { type: string, maxLength: 200 }
        events:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ScheduleEvent"
    ScheduleShare:
      type: object
      required: [shareToken, title, teamSeason, events, createdAt]
      properties:
        shareToken:
          type: string
          format: uuid
        title: { type: string }
        teamSeason: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEvent"
        createdAt:
          type: string
          format: date-time
    ChecklistItem:
      type: object
      required: [id, label, completed]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        label: { type: string, minLength: 1, maxLength: 240 }
        completed: { type: boolean }
        section:
          type: ["string", "null"]
          maxLength: 100
    ChecklistGame:
      type: object
      required: [id, date, time, location, opponent]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        date: { type: string, maxLength: 20 }
        time: { type: string, maxLength: 20 }
        location: { type: string, maxLength: 240 }
        opponent: { type: string, maxLength: 240 }
    ChecklistShareInput:
      type: object
      required: [title, mode, items]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        mode: { type: string, enum: [gameday, tournament] }
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChecklistItem"
        selectedGame:
          type: ["object", "null"]
          allOf:
            - $ref: "#/components/schemas/ChecklistGame"
    ChecklistShareUpdate:
      allOf:
        - $ref: "#/components/schemas/ChecklistShareInput"
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision: { type: integer, minimum: 1 }
    ChecklistShare:
      allOf:
        - $ref: "#/components/schemas/ChecklistShareInput"
        - type: object
          required: [shareToken, revision, createdAt, updatedAt, canManage]
          properties:
            shareToken: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            canManage: { type: boolean }
    ChecklistConflict:
      type: object
      required: [error, current]
      properties:
        error: { type: string }
        current:
          $ref: "#/components/schemas/ChecklistShare"
    StatTrackerEvent:
      type: object
      required: [id, statId, createdAt, period, yards]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        statId: { type: string, minLength: 1, maxLength: 80 }
        createdAt: { type: string, format: date-time }
        period: { type: integer, minimum: 1 }
        attribution:
          type: string
          enum: [team, athlete]
        yards: { type: ["integer", "null"], minimum: 0 }
    StatTrackerGameSnapshot:
      type: object
      required: [id, sport, status, date, opponent, period, score, opponentScore, stats, trackYards, yardStats, events]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        sport:
          type: string
          enum: [baseball, basketball, football, soccer, softball, volleyball]
        status:
          type: string
          enum: [setup, live, paused, final]
        date: { type: string, maxLength: 30 }
        opponent: { type: string, maxLength: 240 }
        period: { type: integer, minimum: 1 }
        score: { type: integer, minimum: 0 }
        opponentScore: { type: integer, minimum: 0 }
        stats:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        trackYards: { type: boolean }
        yardStats:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        events:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/StatTrackerEvent"
    StatTrackerShareInput:
      type: object
      required: [athleteName, teamName, game]
      properties:
        athleteName: { type: string, maxLength: 160 }
        teamName: { type: string, maxLength: 160 }
        game:
          $ref: "#/components/schemas/StatTrackerGameSnapshot"
    StatTrackerShareUpdate:
      allOf:
        - $ref: "#/components/schemas/StatTrackerShareInput"
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision: { type: integer, minimum: 1 }
    StatTrackerShare:
      allOf:
        - $ref: "#/components/schemas/StatTrackerShareInput"
        - type: object
          required: [shareToken, revision, createdAt, updatedAt, expiresAt, canManage]
          properties:
            shareToken: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            canManage: { type: boolean }
    StatTrackerConflict:
      type: object
      required: [error, current]
      properties:
        error: { type: string }
        current:
          $ref: "#/components/schemas/StatTrackerShare"
    HypeCardShareUploadInput:
      type: object
      required: [mediaKind, contentType]
      properties:
        mediaKind:
          type: string
          enum: [video, image, poster]
        contentType:
          type: string
          enum: [video/mp4, video/webm, image/jpeg, image/png]
    HypeCardShareUpload:
      type: object
      required: [uploadUrl, objectPath, claimId, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
        objectPath:
          type: string
        claimId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    HypeCardShareInput:
      type: object
      required: [title, slug, manifest, mediaType]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        manifest:
          type: object
          additionalProperties: true
        shareKey:
          type: string
          minLength: 1
          maxLength: 200
        shareMode:
          type: string
          enum: [card, stats]
          default: card
        mediaType:
          type: string
          enum: [image, video]
        mediaUploadClaimId:
          type: ["string", "null"]
          format: uuid
        posterUploadClaimId:
          type: ["string", "null"]
          format: uuid
        trackerProjectId:
          type: ["string", "null"]
          format: uuid
        athleteName:
          type: ["string", "null"]
          maxLength: 100
        sport:
          type: ["string", "null"]
          enum: [baseball, basketball, football, soccer, volleyball, null]
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        replaceShareToken:
          type: ["string", "null"]
          pattern: "^[A-Za-z0-9_-]{24,80}$"
    HypeCardShareStats:
      type: object
      required: [athleteName, sport, gamesPlayed, score, games, stats, updatedAt]
      properties:
        athleteName:
          type: string
        sport:
          type: string
          enum: [baseball, basketball, football, soccer, volleyball]
        gamesPlayed:
          type: integer
          minimum: 0
        score:
          type: integer
          minimum: 0
        games:
          type: array
          items:
            $ref: "#/components/schemas/HypeCardShareGameSummary"
        stats:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        updatedAt:
          type: string
          format: date-time
    HypeCardShareGameSummary:
      type: object
      required: [date, opponent, score, opponentScore, stats]
      properties:
        date:
          type: string
          maxLength: 30
        opponent:
          type: string
          maxLength: 240
        score:
          type: integer
          minimum: 0
        opponentScore:
          type: integer
          minimum: 0
        stats:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    HypeCardShareReplyInput:
      type: object
      required: [reaction]
      properties:
        reaction:
          type: string
          enum: ["🔥", "👏", "💪", "⭐", "❤️"]
        message:
          type: ["string", "null"]
          maxLength: 240
    HypeCardShareReplyReceipt:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
    HypeCardShareReply:
      type: object
      required: [id, reaction, message, isRead, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reaction:
          type: string
          enum: ["🔥", "👏", "💪", "⭐", "❤️"]
        message:
          type: ["string", "null"]
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
    HypeCardShareReplyList:
      type: object
      required: [unreadCount, replies]
      properties:
        unreadCount:
          type: integer
          minimum: 0
        replies:
          type: array
          items:
            $ref: "#/components/schemas/HypeCardShareReply"
    HypeCardReplyInboxGroup:
      type: object
      required: [shareToken, title, sentAt, unreadCount, replies]
      properties:
        shareToken:
          type: string
        title:
          type: string
        sentAt:
          type: string
          format: date-time
        unreadCount:
          type: integer
          minimum: 0
        replies:
          type: array
          items:
            $ref: "#/components/schemas/HypeCardShareReply"
    HypeCardReplyInbox:
      type: object
      required: [totalCount, unreadCount, groups]
      properties:
        totalCount:
          type: integer
          minimum: 0
        unreadCount:
          type: integer
          minimum: 0
        groups:
          type: array
          items:
            $ref: "#/components/schemas/HypeCardReplyInboxGroup"
    HypeCardShare:
      type: object
      required: [shareToken, slug, title, manifest, shareMode, mediaType, mediaUrl, videoUrl, posterUrl, stats, expiresAt, createdAt]
      properties:
        shareToken:
          type: string
        slug:
          type: string
        title:
          type: string
        manifest:
          type: object
          additionalProperties: true
        shareMode:
          type: string
          enum: [card, stats]
        mediaType:
          type: string
          enum: [image, video]
        mediaUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        posterUrl:
          type: ["string", "null"]
        stats:
          anyOf:
            - $ref: "#/components/schemas/HypeCardShareStats"
            - type: "null"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    AthleteInviteInput:
      type: object
      required: [athleteName, teamName, seasonName, seasonEndsAt, sport, trackerProjectId, scheduleProjectId, showHypeCard, showStats, showSchedule]
      properties:
