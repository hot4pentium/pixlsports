openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Cloud project operations
  - name: storage
    description: Project media storage operations
  - name: schedule-shares
    description: Public schedule sharing operations
  - name: game-on-cards
    description: Event-specific Game On Card destinations
  - name: checklist-shares
    description: Collaborative Gameday Checklist sharing operations
  - name: meeting-workspaces
    description: Authenticated meeting workspace persistence and public recap sharing
  - name: stat-tracker-shares
    description: Live stat tracker spectator sharing operations
  - name: hype-card-shares
    description: Interactive Hype Card sharing operations
  - name: athlete-invites
    description: Durable Athlete Hype Page sharing operations
  - name: athlete-invite-fans
    description: Anonymous fan follows and alerts for Athlete Hype Pages
  - name: account-access
    description: Authenticated account role and Guest usage
  - name: supporter-photos
    description: Private supporter athlete photos
  - name: notifications
    description: Authenticated browser push notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /schedule-shares:
    post:
      operationId: createScheduleShare
      tags: [schedule-shares]
      summary: Create a public schedule share
      description: Creates a public snapshot containing schedule details only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleShareInput"
      responses:
        "201":
          description: Public schedule share created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /schedule-shares/{shareToken}:
    parameters:
      - $ref: "#/components/parameters/ScheduleShareToken"
    get:
      operationId: getScheduleShare
      tags: [schedule-shares]
      summary: Get a public schedule share
      description: Returns schedule details without requiring a LeagueMatrix account.
      responses:
        "200":
          description: Public schedule details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleShare"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateScheduleShare
      tags: [schedule-shares]
      summary: Update a public schedule share
      description: Updates a schedule share owned by the authenticated account while keeping its public link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleShareInput"
      responses:
        "200":
          description: Public schedule share updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteScheduleShare
      tags: [schedule-shares]
      summary: Revoke a public schedule share
      description: Revokes a schedule share owned by the authenticated account.
      responses:
        "204":
          description: Public schedule share revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /game-on-cards/owned:
    get:
      operationId: listOwnedGameOnCards
      tags: [game-on-cards]
      summary: List owned Game On Cards
      description: Lists the caller's explicitly marked Game On Card shares containing exactly one game or practice event. Older device-saved cards remain available on their original device.
      responses:
        "200":
          description: Owned Game On Cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleShare"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /game-on-cards/{shareToken}:
    parameters:
      - $ref: "#/components/parameters/ScheduleShareToken"
    get:
      operationId: getGameOnCard
      tags: [game-on-cards]
      summary: Get a public event-specific Game On Card
      description: Returns one sanitized event and only destinations the owner has deliberately shared.
      responses:
        "200":
          description: Public Game On Card and current related destinations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameOnCard"
        "404":
          $ref: "#/components/responses/NotFound"
  /checklist-shares:
    post:
      operationId: createChecklistShare
      tags: [checklist-shares]
      summary: Create a collaborative Gameday Checklist share
      description: Creates an edit link owned by the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistShareInput"
      responses:
        "201":
          description: Collaborative checklist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /checklist-shares/{shareToken}:
    parameters:
      - $ref: "#/components/parameters/ChecklistShareToken"
    get:
      operationId: getChecklistShare
      tags: [checklist-shares]
      summary: Open a collaborative checklist edit link
      responses:
        "200":
          description: Current checklist contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistShare"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateChecklistShare
      tags: [checklist-shares]
      summary: Save a collaborative checklist edit
      description: Saves only when the expected revision is current.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistShareUpdate"
      responses:
        "200":
          description: Checklist updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Expected revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistConflict"
    delete:
      operationId: deleteChecklistShare
      tags: [checklist-shares]
      summary: Revoke a collaborative checklist edit link
      description: Only the checklist owner can revoke the link.
      responses:
        "204":
          description: Checklist link revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /meeting-workspaces/{meetingId}:
    parameters:
      - $ref: "#/components/parameters/MeetingId"
    get:
      operationId: getMeetingWorkspace
      tags: [meeting-workspaces]
      summary: Get the authenticated owner's meeting workspace
      responses:
        "200":
          description: Meeting workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingWorkspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: upsertMeetingWorkspace
      tags: [meeting-workspaces]
      summary: Save the authenticated owner's meeting workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingWorkspaceUpdate"
      responses:
        "200":
          description: Meeting workspace saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingWorkspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Expected revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingWorkspaceConflict"
    delete:
      operationId: deleteMeetingWorkspace
      tags: [meeting-workspaces]
      summary: Revoke the authenticated owner's meeting recap link
      responses:
        "204":
          description: Meeting workspace revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /meeting-recaps/{shareToken}:
    parameters:
      - $ref: "#/components/parameters/MeetingShareToken"
    get:
      operationId: getMeetingRecap
      tags: [meeting-workspaces]
      summary: Get a public read-only meeting recap
      responses:
        "200":
          description: Public meeting recap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingRecap"
        "404":
          $ref: "#/components/responses/NotFound"
  /stat-tracker-shares:
    get:
      operationId: listStatTrackerShares
      tags: [stat-tracker-shares]
      summary: List active stat tracker shares owned by the authenticated user
      responses:
        "200":
          description: Active owned shares, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatTrackerShare"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createStatTrackerShare
      tags: [stat-tracker-shares]
      summary: Create a live stat tracker spectator share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatTrackerShareInput"
      responses:
        "201":
          description: Live spectator share created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatTrackerShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stat-tracker-shares/{shareToken}:
    parameters:
      - $ref: "#/components/parameters/StatTrackerShareToken"
    get:
      operationId: getStatTrackerShare
      tags: [stat-tracker-shares]
      summary: Get a live stat tracker spectator share
      responses:
        "200":
          description: Sanitized live game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatTrackerShare"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateStatTrackerShare
      tags: [stat-tracker-shares]
      summary: Update a live stat tracker spectator share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatTrackerShareUpdate"
      responses:
        "200":
          description: Updated live spectator share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatTrackerShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Expected revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatTrackerConflict"
    delete:
      operationId: deleteStatTrackerShare
      tags: [stat-tracker-shares]
      summary: Revoke a live stat tracker spectator share
      responses:
        "204":
          description: Spectator link revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /stat-tracker-shares/{shareToken}/events:
    parameters:
      - $ref: "#/components/parameters/StatTrackerShareToken"
    get:
      operationId: getStatTrackerShareEvents
      tags: [stat-tracker-shares]
      summary: Subscribe to live stat tracker updates
      responses:
        "200":
          description: Server-sent spectator updates
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites:
    get:
      operationId: listAthleteInvites
      tags: [athlete-invites]
      summary: List athlete invites owned by the authenticated user
      responses:
        "200":
          description: Owned athlete invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedAthleteInviteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAthleteInvite
      tags: [athlete-invites]
      summary: Create an Athlete Hype Page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteInviteInput"
      responses:
        "201":
          description: Athlete invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedAthleteInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: This account already has an athlete invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /athlete-invites/{inviteToken}:
    parameters:
      - in: path
        name: inviteToken
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{24,80}$"
    get:
      operationId: getAthleteInvite
      tags: [athlete-invites]
      summary: Get a public Athlete Hype Page
      responses:
        "200":
          description: Current public athlete page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAthleteInvite"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAthleteInvite
      tags: [athlete-invites]
      summary: Update an owned Athlete Hype Page without changing its URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteInviteInput"
      responses:
        "200":
          description: Athlete invite updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedAthleteInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAthleteInvite
      tags: [athlete-invites]
      summary: Pause an owned Athlete Hype Page
      description: Pauses the page without changing its stable URL. The page can be resumed with the update operation.
      responses:
        "204":
          description: Athlete invite revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites/{inviteToken}/fan:
    parameters:
      - $ref: "#/components/parameters/AthleteInviteToken"
    get:
      operationId: getAthleteFanCard
      tags: [athlete-invites]
      summary: Get an athlete fan card with a sanitized live scoreboard
      description: Returns the same safe card content as the public invite without a reusable live-session token or raw game events.
      responses:
        "200":
          description: Public athlete fan card and optional sanitized live scoreboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAthleteFanCard"
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites/{inviteToken}/event-links:
    parameters:
      - $ref: "#/components/parameters/AthleteInviteToken"
    get:
      operationId: getAthleteInviteEventLinks
      tags: [athlete-invites]
      summary: List Game On Cards linked to an owned athlete invite
      responses:
        "200":
          description: Explicitly linked Game On Card share tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteInviteEventLinks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: replaceAthleteInviteEventLinks
      tags: [athlete-invites]
      summary: Replace the Game On Cards linked to an owned athlete invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteInviteEventLinksInput"
      responses:
        "200":
          description: Replaced explicit Game On Card links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteInviteEventLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites/{inviteToken}/event-links/{shareToken}/notify:
    parameters:
      - $ref: "#/components/parameters/AthleteInviteToken"
      - $ref: "#/components/parameters/ScheduleShareToken"
    post:
      operationId: notifyAthleteInviteEventFollowers
      tags: [athlete-invites]
      summary: Manually notify opted-in followers about a linked upcoming Game On Card
      description: Sends only to current followers with event alerts enabled. Each recipient gets at most one attempted push per share event.
      responses:
        "200":
          description: Push attempt outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteInviteEventNotifyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The linked event is no longer upcoming or eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /athlete-invites/{inviteToken}/hypes:
    parameters:
      - $ref: "#/components/parameters/AthleteInviteToken"
    post:
      operationId: sendAthleteInviteHype
      tags: [athlete-invites]
      summary: Send encouragement to an active living athlete card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteInviteHypeInput"
      responses:
        "201":
          description: Hype received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteInviteHypeAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many Hypes from this visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listAthleteInviteHypes
      tags: [athlete-invites]
      summary: Review Hypes as the card owner
      responses:
        "200":
          description: Most recent Hypes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AthleteInviteHype"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites/{inviteToken}/hypes/{hypeId}:
    parameters:
      - $ref: "#/components/parameters/AthleteInviteToken"
      - in: path
        name: hypeId
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteAthleteInviteHype
      tags: [athlete-invites]
      summary: Remove an unwanted Hype as the card owner
      responses:
        "204":
          description: Hype removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites/{inviteToken}/live:
    parameters:
      - in: path
        name: inviteToken
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{24,80}$"
    post:
      operationId: startAthleteInviteLive
      tags: [athlete-invites]
      summary: Start a short-lived Game Day Live session for an Athlete Hype Page
      responses:
        "201":
          description: Short-lived live session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteInviteLiveSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No live game is available in the selected tracker project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: stopAthleteInviteLive
      tags: [athlete-invites]
      summary: Stop Game Day Live for an Athlete Hype Page
      responses:
        "204":
          description: Live session stopped
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites/{inviteToken}/photo/upload-url:
    parameters:
      - $ref: "#/components/parameters/AthleteInviteToken"
    post:
      operationId: requestAthleteInvitePhotoUploadUrl
      tags: [athlete-invites]
      summary: Request an owner-only athlete page photo upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteInvitePhotoUploadInput"
      responses:
        "200":
          description: Presigned private upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteInvitePhotoUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites/{inviteToken}/photo:
    parameters:
      - $ref: "#/components/parameters/AthleteInviteToken"
    put:
      operationId: confirmAthleteInvitePhoto
      tags: [athlete-invites]
      summary: Confirm a completed owner-only athlete page photo upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteInvitePhotoConfirmInput"
      responses:
        "200":
          description: Confirmed public photo URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteInvitePhoto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeAthleteInvitePhoto
      tags: [athlete-invites]
      summary: Remove the owner-only athlete page photo
      responses:
        "204":
          description: Photo removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites/{inviteToken}/photo/image:
    parameters:
      - $ref: "#/components/parameters/AthleteInviteToken"
    get:
      operationId: serveAthleteInvitePhoto
      tags: [athlete-invites]
      summary: Serve the current photo for an active athlete invite
      responses:
        "200":
          description: Athlete page photo
          content:
            image/webp: {}
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites/{inviteToken}/icon/{size}.png:
    parameters:
      - $ref: "#/components/parameters/AthleteInviteToken"
      - in: path
        name: size
        required: true
        schema:
          type: integer
          enum: [192, 512]
    get:
      operationId: serveAthleteInviteIcon
      tags: [athlete-invites]
      summary: Serve an active athlete invite install icon
      responses:
        "200":
          description: PNG icon with the exact requested dimensions
          content:
            image/png: {}
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites/{inviteToken}/manifest.webmanifest:
    parameters:
      - $ref: "#/components/parameters/AthleteInviteToken"
    get:
      operationId: getAthleteInviteManifest
      tags: [athlete-invites]
      summary: Get an install manifest scoped to an active athlete fan page
      description: Accepts an optional basePath query containing only safe slash-separated path segments for deployments mounted below the domain root.
      responses:
        "200":
          description: Dynamic install manifest for this athlete
          content:
            application/manifest+json:
              schema:
                $ref: "#/components/schemas/AthleteInviteManifest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /athlete-invites/{inviteToken}/follows:
    parameters:
      - $ref: "#/components/parameters/AthleteInviteToken"
    post:
      operationId: createAthleteInviteFanFollow
      tags: [athlete-invite-fans]
      summary: Follow an active athlete invite anonymously on this device
      description: New follows are accepted only while this invite is active. The same browser subscription may follow different invites independently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteInviteFanFollowInput"
      responses:
        "201":
          description: Device follow created; keep the returned token private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteInviteFanFollowCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
