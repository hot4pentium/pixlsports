      type: object
      required: [error, current]
      properties:
        error: { type: string }
        current:
          $ref: "#/components/schemas/StatTrackerShare"
    HypeCardShareUploadInput:
      type: object
      required: [mediaKind, contentType]
      properties:
        mediaKind:
          type: string
          enum: [video, image, poster]
        contentType:
          type: string
          enum: [video/mp4, video/webm, image/jpeg, image/png]
    HypeCardShareUpload:
      type: object
      required: [uploadUrl, objectPath, claimId, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
        objectPath:
          type: string
        claimId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    HypeCardShareInput:
      type: object
      required: [title, slug, manifest, mediaType]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        manifest:
          type: object
          additionalProperties: true
        mediaName:
          type: string
          minLength: 1
          maxLength: 80
        shareKey:
          type: string
          minLength: 1
          maxLength: 200
        shareMode:
          type: string
          enum: [card, stats]
          default: card
        mediaType:
          type: string
          enum: [image, video]
        mediaUploadClaimId:
          type: ["string", "null"]
          format: uuid
        posterUploadClaimId:
          type: ["string", "null"]
          format: uuid
        trackerProjectId:
          type: ["string", "null"]
          format: uuid
        athleteName:
          type: ["string", "null"]
          maxLength: 100
        sport:
          type: ["string", "null"]
          enum: [baseball, basketball, football, soccer, volleyball, null]
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        replaceShareToken:
          type: ["string", "null"]
          pattern: "^[A-Za-z0-9_-]{24,80}$"
    HypeCardShareStats:
      type: object
      required: [athleteName, sport, gamesPlayed, score, record, games, stats, updatedAt]
      properties:
        athleteName:
          type: string
        sport:
          type: string
          enum: [baseball, basketball, football, soccer, volleyball]
        gamesPlayed:
          type: integer
          minimum: 0
        score:
          type: integer
          minimum: 0
        record:
          type: object
          required: [wins, losses, ties, gamesPlayed]
          properties:
            wins: { type: integer, minimum: 0 }
            losses: { type: integer, minimum: 0 }
            ties: { type: integer, minimum: 0 }
            gamesPlayed: { type: integer, minimum: 0 }
        games:
          type: array
          items:
            $ref: "#/components/schemas/HypeCardShareGameSummary"
        stats:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        updatedAt:
          type: string
          format: date-time
    HypeCardShareGameSummary:
      type: object
      required: [date, opponent, score, opponentScore, scoreRecorded, stats, athleteStats]
      properties:
        date:
          type: string
          maxLength: 30
        opponent:
          type: string
          maxLength: 240
        score:
          type: integer
          minimum: 0
        opponentScore:
          type: integer
          minimum: 0
        scoreRecorded:
          type: boolean
        stats:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        athleteStats:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    HypeCardShareReplyInput:
      type: object
      required: [reaction]
      properties:
        reaction:
          type: string
          enum: ["🔥", "👏", "💪", "⭐", "❤️"]
        message:
          type: ["string", "null"]
          maxLength: 240
    HypeCardShareReplyReceipt:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
    HypeCardShareReply:
      type: object
      required: [id, reaction, message, isRead, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reaction:
          type: string
          enum: ["🔥", "👏", "💪", "⭐", "❤️"]
        message:
          type: ["string", "null"]
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
    HypeCardShareReplyList:
      type: object
      required: [unreadCount, replies]
      properties:
        unreadCount:
          type: integer
          minimum: 0
        replies:
          type: array
          items:
            $ref: "#/components/schemas/HypeCardShareReply"
    HypeCardReplyInboxGroup:
      type: object
      required: [shareToken, title, sentAt, unreadCount, replies]
      properties:
        shareToken:
          type: string
        title:
          type: string
        sentAt:
          type: string
          format: date-time
        unreadCount:
          type: integer
          minimum: 0
        replies:
          type: array
          items:
            $ref: "#/components/schemas/HypeCardShareReply"
    HypeCardReplyInbox:
      type: object
      required: [totalCount, unreadCount, groups]
      properties:
        totalCount:
          type: integer
          minimum: 0
        unreadCount:
          type: integer
          minimum: 0
        groups:
          type: array
          items:
            $ref: "#/components/schemas/HypeCardReplyInboxGroup"
    HypeCardShare:
      type: object
      required: [shareToken, slug, title, mediaName, manifest, shareMode, mediaType, mediaUrl, videoUrl, posterUrl, stats, expiresAt, createdAt]
      properties:
        shareToken:
          type: string
        slug:
          type: string
        title:
          type: string
        mediaName:
          type: string
          maxLength: 80
        manifest:
          type: object
          additionalProperties: true
        shareMode:
          type: string
          enum: [card, stats]
        mediaType:
          type: string
          enum: [image, video]
        mediaUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        posterUrl:
          type: ["string", "null"]
