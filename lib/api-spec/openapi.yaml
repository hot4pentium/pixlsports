        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/subscriptions/status:
    get:
      operationId: getNotificationSubscriptionStatus
      tags: [notifications]
      summary: Check ownership of a browser push subscription
      parameters:
        - name: endpoint
          in: query
          required: true
          schema:
            type: string
            format: uri
            maxLength: 2048
      responses:
        "200":
          description: Subscription ownership status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSubscriptionStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/test:
    post:
      operationId: sendTestNotification
      tags: [notifications]
      summary: Send a test notification
      responses:
        "202":
          description: Test notification queued
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Push notifications are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No live subscription received the notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notifications/deliveries/{deliveryId}/displayed:
    post:
      operationId: acknowledgeNotificationDisplayed
      tags: [notifications]
      summary: Acknowledge that a push notification was displayed by the device
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDisplayReceiptInput"
      responses:
        "204":
          description: Display receipt recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    AthleteInviteToken:
      in: path
      name: inviteToken
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{24,80}$"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaUploadClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChecklistShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
    MeetingShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{32,80}$"
    StatTrackerShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HypeCardShareToken:
      name: shareToken
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{24,80}$"
    HypeCardShareReplyId:
      name: replyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HypeCardShareMediaKind:
      name: mediaKind
      in: path
      required: true
      schema:
        type: string
        enum: [video, poster]
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SupporterPhoto:
      type: object
      required: [url, contentType, size, cropX, cropY, cropZoom, updatedAt]
      properties:
        url: { type: string }
        contentType: { type: string }
        size: { type: integer, minimum: 1 }
        cropX: { type: integer, minimum: 0, maximum: 100 }
        cropY: { type: integer, minimum: 0, maximum: 100 }
        cropZoom: { type: integer, minimum: 100, maximum: 250 }
        updatedAt: { type: string, format: date-time }
    SupporterPhotoUploadInput:
      type: object
      required: [contentType, size]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
    SupporterPhotoUpload:
      type: object
      required: [uploadUrl, objectPath]
      properties:
        uploadUrl: { type: string, format: uri }
        objectPath: { type: string }
    SupporterPhotoSave:
      type: object
      required: [objectPath, cropX, cropY, cropZoom]
      properties:
        objectPath: { type: string, minLength: 10 }
        cropX: { type: integer, minimum: 0, maximum: 100 }
        cropY: { type: integer, minimum: 0, maximum: 100 }
        cropZoom: { type: integer, minimum: 100, maximum: 250 }
    NotificationConfig:
      type: object
      required: [available, publicKey]
      properties:
        available: { type: boolean }
        publicKey: { type: ["string", "null"], maxLength: 300 }
    NotificationPreferences:
      type: object
      required: [oneHourBefore, dayOf]
      properties:
        oneHourBefore: { type: boolean }
        dayOf: { type: boolean }
    NotificationPreferencesUpdate:
      type: object
      required: [oneHourBefore, dayOf]
      properties:
        oneHourBefore: { type: boolean }
        dayOf: { type: boolean }
    SupporterActiveGame:
      type: object
      additionalProperties: false
      required: [gameId]
      properties:
        gameId: { type: ["string", "null"], minLength: 1, maxLength: 255 }
    SupporterActiveGameUpdate:
      type: object
      additionalProperties: false
      required: [gameId]
      properties:
        gameId: { type: ["string", "null"], minLength: 1, maxLength: 255 }
    NotificationSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 1, maxLength: 300 }
            auth: { type: string, minLength: 1, maxLength: 300 }
    NotificationSubscriptionDeleteInput:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
    NotificationSubscriptionStatus:
      type: object
      required: [owned, ownedByAnotherAccount]
      properties:
        owned: { type: boolean }
        ownedByAnotherAccount: { type: boolean }
    NotificationDisplayReceiptInput:
      type: object
      required: [subscriptionEndpoint]
      properties:
        subscriptionEndpoint: { type: string, format: uri, maxLength: 2048 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ScheduleEvent:
      type: object
      required: [id, type, date, time, location, opponent, snacks, drinks, notes]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [game, practice, meeting] }
        status: { type: string, enum: [upcoming, live, final] }
        date: { type: string, maxLength: 30 }
        time: { type: string, maxLength: 30 }
        location: { type: string, maxLength: 300 }
        opponent: { type: string, maxLength: 200 }
        snacks: { type: string, maxLength: 300 }
        drinks: { type: string, maxLength: 300 }
        notes: { type: string, maxLength: 1000 }
    ScheduleShareInput:
      type: object
      required: [title, teamSeason, events]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        teamSeason: { type: string, maxLength: 200 }
        purpose:
          type: string
          enum: [game-on-card]
          description: Omit for Calendar sharing. Marks an event-specific Game On Card without changing its public response.
        events:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ScheduleEvent"
    ScheduleShare:
      type: object
      required: [shareToken, title, teamSeason, events, createdAt]
      properties:
        shareToken:
          type: string
          format: uuid
        title: { type: string }
        teamSeason: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEvent"
        createdAt:
          type: string
          format: date-time
    GameOnCardEvent:
      type: object
      required: [id, type, date, time, location, opponent]
      properties:
        id: { type: string }
        type: { type: string, enum: [game, practice] }
        status: { type: string, enum: [upcoming, live, final] }
        date: { type: string }
        time: { type: string }
        location: { type: string }
        opponent: { type: string }
    GameOnCard:
      type: object
      required: [shareToken, title, teamSeason, event, stage, prepState, statsState, athletePageState]
      properties:
        shareToken: { type: string, format: uuid }
        title: { type: string }
        teamSeason: { type: string }
        event:
          $ref: "#/components/schemas/GameOnCardEvent"
        stage: { type: string, enum: [upcoming, live, final] }
        prepState: { type: string, enum: [private, shared] }
        prepShareToken: { type: string, format: uuid }
        statsState: { type: string, enum: [not-shared, live, final, expired] }
        statsShareToken: { type: string, format: uuid }
        statsUpdatedAt:
          type: string
          format: date-time
          description: Last tracker share update, present only for an active event-specific live or final stats share.
        athletePageState: { type: string, enum: [unpublished, paused, published] }
        athletePageToken: { type: string, maxLength: 100 }
        athleteName: { type: string, maxLength: 200 }
    ChecklistItem:
      type: object
      required: [id, label, completed]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        label: { type: string, minLength: 1, maxLength: 240 }
        completed: { type: boolean }
        section:
          type: ["string", "null"]
          maxLength: 100
    ChecklistGame:
      type: object
      required: [id, date, time, location, opponent]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [game, practice, meeting] }
        date: { type: string, maxLength: 20 }
        time: { type: string, maxLength: 20 }
        location: { type: string, maxLength: 240 }
        opponent: { type: string, maxLength: 240 }
    ChecklistShareInput:
      type: object
      required: [title, mode, items]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: string, maxLength: 2000 }
        mode: { type: string, enum: [gameday, tournament] }
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChecklistItem"
        selectedGame:
          type: ["object", "null"]
          allOf:
            - $ref: "#/components/schemas/ChecklistGame"
    ChecklistShareUpdate:
      allOf:
        - $ref: "#/components/schemas/ChecklistShareInput"
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision: { type: integer, minimum: 1 }
    ChecklistShare:
      allOf:
        - $ref: "#/components/schemas/ChecklistShareInput"
        - type: object
          required: [shareToken, revision, createdAt, updatedAt, canManage]
          properties:
            shareToken: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            canManage: { type: boolean }
    ChecklistConflict:
      type: object
      required: [error, current]
      properties:
        error: { type: string }
        current:
          $ref: "#/components/schemas/ChecklistShare"
    MeetingContext:
      type: object
      required: [id, date, time, location, title]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        date: { type: string, maxLength: 20 }
        time: { type: string, maxLength: 20 }
        location: { type: string, maxLength: 240 }
        title: { type: string, minLength: 1, maxLength: 240 }
    MeetingParticipant:
      type: object
      required: [id, name, role, present]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        name: { type: string, minLength: 1, maxLength: 160 }
        role: { type: string, maxLength: 160 }
        present: { type: boolean }
    MeetingAgendaItem:
      type: object
      required: [id, label, completed]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        label: { type: string, minLength: 1, maxLength: 240 }
        completed: { type: boolean }
    MeetingDecision:
      type: object
      required: [id, text]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        text: { type: string, maxLength: 2000 }
    MeetingFollowUp:
      type: object
      required: [id, task, owner, dueDate]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        task: { type: string, maxLength: 500 }
        owner: { type: string, maxLength: 160 }
        dueDate: { type: string, maxLength: 20 }
    MeetingWorkspacePayload:
      type: object
      required: [notes, participants, agenda, decisions, followUps, startedAt, endedAt, context]
      properties:
        notes: { type: string, maxLength: 10000 }
        participants:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MeetingParticipant"
        agenda:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MeetingAgendaItem"
        decisions:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MeetingDecision"
        followUps:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MeetingFollowUp"
        startedAt: { type: ["string", "null"], format: date-time }
        endedAt: { type: ["string", "null"], format: date-time }
        context:
          $ref: "#/components/schemas/MeetingContext"
    MeetingWorkspaceUpdate:
      type: object
      required: [workspace]
      properties:
        workspace:
          $ref: "#/components/schemas/MeetingWorkspacePayload"
        expectedRevision:
          type: ["integer", "null"]
          minimum: 1
    MeetingWorkspace:
      type: object
      required: [id, ownerClerkUserId, ownerMeetingId, publicToken, workspace, revision, revokedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ownerClerkUserId: { type: string, minLength: 1, maxLength: 255 }
        ownerMeetingId: { type: string, minLength: 1, maxLength: 160 }
        publicToken: { type: string, pattern: "^[A-Za-z0-9_-]{32,80}$" }
        workspace:
          $ref: "#/components/schemas/MeetingWorkspacePayload"
        revision: { type: integer, minimum: 1 }
        revokedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MeetingRecap:
      type: object
      required: [workspace, revision, updatedAt]
      properties:
        workspace:
          $ref: "#/components/schemas/MeetingWorkspacePayload"
        revision: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    MeetingWorkspaceConflict:
      type: object
      required: [error, current]
      properties:
        error: { type: string }
        current:
          $ref: "#/components/schemas/MeetingWorkspace"
    StatTrackerEvent:
      type: object
      required: [id, statId, createdAt, period, yards]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        statId: { type: string, minLength: 1, maxLength: 80 }
        createdAt: { type: string, format: date-time }
        period: { type: integer, minimum: 1 }
        attribution:
          type: string
          enum: [team, athlete]
        playId: { type: string, minLength: 1, maxLength: 160 }
        yards: { type: ["integer", "null"], minimum: 0 }
    StatTrackerGameSnapshot:
      type: object
      required: [id, sport, status, date, opponent, period, score, opponentScore, stats, trackYards, yardStats, events]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        sport:
          type: string
          enum: [baseball, basketball, football, soccer, softball, volleyball]
        status:
          type: string
          enum: [setup, live, paused, final]
        date: { type: string, maxLength: 30 }
        opponent: { type: string, maxLength: 240 }
        period: { type: integer, minimum: 1 }
        soccerPeriodFormat:
          type: string
          enum: [halves, quarters]
        score: { type: integer, minimum: 0 }
        opponentScore: { type: integer, minimum: 0 }
        stats:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        trackYards: { type: boolean }
        yardStats:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        events:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/StatTrackerEvent"
    StatTrackerShareInput:
      type: object
      required: [athleteName, teamName, game]
      properties:
        athleteName: { type: string, maxLength: 160 }
        teamName: { type: string, maxLength: 160 }
        game:
          $ref: "#/components/schemas/StatTrackerGameSnapshot"
    StatTrackerShareUpdate:
      allOf:
        - $ref: "#/components/schemas/StatTrackerShareInput"
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision: { type: integer, minimum: 1 }
    StatTrackerShare:
      allOf:
        - $ref: "#/components/schemas/StatTrackerShareInput"
        - type: object
          required: [shareToken, revision, createdAt, updatedAt, expiresAt, canManage]
          properties:
            shareToken: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            canManage: { type: boolean }
