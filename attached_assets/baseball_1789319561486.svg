<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2000" viewBox="0 0 750 1000">
  <title>LeagueMatrix vertical baseball diamond</title>
  <desc id="description">A clean top-down baseball diamond in portrait orientation for practice planning and player placement.</desc>

  <defs>
    <linearGradient id="outfield-turf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c8a4d"/>
      <stop offset="0.55" stop-color="#20733f"/>
      <stop offset="1" stop-color="#175c36"/>
    </linearGradient>

    <linearGradient id="infield-clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98551"/>
      <stop offset="1" stop-color="#a95f38"/>
    </linearGradient>

    

    
      
    

    <clipPath id="field-clip">
      <path d="M233 700 L40 507 Q375 -180 710 507 L517 700 Z"/>
    </clipPath>
  </defs>

  
  <rect id="canvas-background" width="750" height="1000" fill="#123d27"/>
  <rect x="18" y="18" width="714" height="964" rx="24" fill="#174c2e" stroke="#2d8650" stroke-width="2"/>

  
  <g id="surface">
    <path d="M233 700 L40 507 Q375 -180 710 507 L517 700 Z" fill="url(#outfield-turf)"/>
    <rect x="25" y="145" width="700" height="560" fill="url(#outfield-stripes)" clip-path="url(#field-clip)"/>
  </g>

  
  <g id="warning-track" fill="none" stroke-linecap="round">
    <path d="M50 509 Q375 -150 700 509" stroke="#a95f38" stroke-width="25" opacity="0.98"/>
    <path d="M40 507 Q375 -180 710 507" stroke="#f5f8f5" stroke-width="4"/>
  </g>

  
  <g id="infield">
    <path d="M375 852 L527 700 L375 548 L223 700 Z" fill="url(#infield-clay)" stroke="#dca075" stroke-width="2"/>
    <path d="M375 814 L489 700 L375 586 L261 700 Z" fill="#247a45" stroke="#1c6539" stroke-width="2"/>
    <circle cx="375" cy="700" r="39" fill="url(#infield-clay)"/>
    <circle cx="375" cy="700" r="5" fill="#f8fbf8"/>
    <path d="M350 832 Q375 818 400 832 L413 875 Q375 893 337 875 Z" fill="url(#infield-clay)"/>
  </g>

  
  <g id="field-markings" fill="none" stroke="#f8fbf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="233" y1="700" x2="40" y2="507"/>
    <line x1="517" y1="700" x2="710" y2="507"/>
    <path d="M375 842 L517 700 L375 558 L233 700 Z" stroke-width="3" opacity="0.92"/>

    
    <path d="M358 864 Q375 879 392 864" stroke-width="3" opacity="0.8"/>
  </g>

  
  <g id="bases" fill="#f8fbf8" stroke="#e7ece8" stroke-width="2">
    <rect x="506" y="689" width="22" height="22" rx="2" transform="rotate(45 517 700)"/>
    <rect x="364" y="547" width="22" height="22" rx="2" transform="rotate(45 375 558)"/>
    <rect x="222" y="689" width="22" height="22" rx="2" transform="rotate(45 233 700)"/>
    <path d="M375 838 L387 846 L383 861 H367 L363 846 Z"/>
  </g>

  
  <g id="foul-poles" fill="#f6cf3a">
    <rect x="36" y="476" width="7" height="36" rx="3"/>
    <rect x="707" y="476" width="7" height="36" rx="3"/>
  </g>
</svg>