<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="720" viewBox="0 0 1000 360">
  <title>LeagueMatrix championship-style blank lower third</title>
  <desc id="description">A transparent, sport-neutral lower third with raised side wings, a blank metallic center crest, and a large empty nameplate.</desc>

  <defs>
    <linearGradient id="navy-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17365b"/>
      <stop offset="0.42" stop-color="#07182b"/>
      <stop offset="0.72" stop-color="#102d4a"/>
      <stop offset="1" stop-color="#04101d"/>
    </linearGradient>

    <linearGradient id="deep-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04111f"/>
      <stop offset="0.5" stop-color="#102c49"/>
      <stop offset="1" stop-color="#03101c"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f4f5"/>
      <stop offset="0.18" stop-color="#8798a4"/>
      <stop offset="0.5" stop-color="#d9e0e2"/>
      <stop offset="0.72" stop-color="#596976"/>
      <stop offset="1" stop-color="#c5cfd3"/>
    </linearGradient>

    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d27"/>
      <stop offset="0.5" stop-color="#ff7a32"/>
      <stop offset="1" stop-color="#ffad3d"/>
    </linearGradient>

    <linearGradient id="electric-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#168cff"/>
      <stop offset="0.5" stop-color="#8bd8ff"/>
      <stop offset="1" stop-color="#146cff"/>
    </linearGradient>

    <radialGradient id="crest-face" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#43566a"/>
      <stop offset="0.3" stop-color="#172a40"/>
      <stop offset="0.68" stop-color="#071827"/>
      <stop offset="1" stop-color="#020911"/>
    </radialGradient>

    

    
      
    

    
      
      
        
        
      
    
  </defs>

  

  
  <g id="wrap-rails">
    <path d="M0 112 L70 45 L245 56 L318 129 L278 182 H84 L0 247 Z" fill="url(#deep-blue)" stroke="url(#silver)" stroke-width="8"/>
    <path d="M1000 112 L930 45 L755 56 L682 129 L722 182 H916 L1000 247 Z" fill="url(#deep-blue)" stroke="url(#silver)" stroke-width="8"/>

    <path d="M0 126 L75 59 L238 70 L299 130 L270 166 H92 L0 226 Z" fill="url(#navy-face)" stroke="url(#orange)" stroke-width="5"/>
    <path d="M1000 126 L925 59 L762 70 L701 130 L730 166 H908 L1000 226 Z" fill="url(#navy-face)" stroke="url(#orange)" stroke-width="5"/>

    
    <path d="M0 151 L53 105 L83 132 L36 181 L83 212 L0 267 Z" fill="#102b49" stroke="#157ee8" stroke-width="4"/>
    <path d="M1000 151 L947 105 L917 132 L964 181 L917 212 L1000 267 Z" fill="#102b49" stroke="#157ee8" stroke-width="4"/>
  </g>

  
  <g id="blank-center-crest">
    <circle cx="500" cy="176" r="142" fill="#050b12" stroke="url(#silver)" stroke-width="9"/>
    <circle cx="500" cy="176" r="129" fill="none" stroke="url(#electric-blue)" stroke-width="7"/>
    <circle cx="500" cy="176" r="119" fill="url(#crest-face)" stroke="#768895" stroke-width="3"/>
    <circle cx="500" cy="176" r="109" fill="url(#carbon)" opacity="0.72"/>
    <path d="M401 138 Q500 69 599 138" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.18"/>
    <path d="M411 235 Q500 282 589 235" fill="none" stroke="#000000" stroke-width="7" opacity="0.45"/>
  </g>

  
  <g id="nameplate">
    <path d="M73 139 H927 L962 174 V267 L928 303 H72 L38 268 V174 Z" fill="#020811" stroke="#05080d" stroke-width="12"/>
    <path d="M79 145 H921 L950 176 V262 L921 292 H79 L50 262 V178 Z" fill="url(#silver)" stroke="#263340" stroke-width="4"/>
    <path d="M92 158 H908 L936 184 V255 L908 279 H92 L64 254 V184 Z" fill="url(#navy-face)" stroke="#05101c" stroke-width="6"/>
    <path d="M104 169 H896 L923 191 V247 L896 268 H104 L77 247 V191 Z" fill="url(#deep-blue)" stroke="#71818c" stroke-width="3"/>
    <path d="M106 171 H894 L918 191" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.17"/>
    <rect x="104" y="169" width="792" height="99" fill="url(#carbon)" opacity="0.55"/>

    
    <path d="M83 283 H917" stroke="#07101b" stroke-width="14"/>
    <path d="M83 281 H493" stroke="url(#orange)" stroke-width="6"/>
    <path d="M507 281 H917" stroke="url(#electric-blue)" stroke-width="6"/>
  </g>

  
  <g id="lower-extension">
    <path d="M203 299 L250 284 H750 L797 299 L757 338 H243 Z" fill="url(#silver)" stroke="#17212a" stroke-width="4"/>
    <path d="M225 302 L260 292 H740 L775 302 L748 328 H252 Z" fill="url(#deep-blue)" stroke="#ff6b2f" stroke-width="3"/>
    <path d="M267 318 H733" stroke="#ffffff" stroke-width="2" opacity="0.12"/>
  </g>
</svg>