<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2000" viewBox="0 0 750 1000">
  <title>LeagueMatrix vertical American football field</title>
  <desc id="description">A clean top-down American football field in portrait orientation for practice planning and player placement.</desc>

  <defs>
    <linearGradient id="field-turf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#237747"/>
      <stop offset="0.5" stop-color="#1d6a3e"/>
      <stop offset="1" stop-color="#155833"/>
    </linearGradient>

    

    

    
      
    

    <clipPath id="field-clip">
      <rect x="145" y="50" width="460" height="900" rx="2"/>
    </clipPath>
  </defs>

  
  <rect id="canvas-background" width="750" height="1000" fill="#102d1e"/>
  <rect x="18" y="18" width="714" height="964" rx="24" fill="#17442c" stroke="#2b7449" stroke-width="2"/>

  
  <g id="surface">
    <rect x="145" y="50" width="460" height="900" rx="2" fill="url(#field-turf)"/>
    <rect x="145" y="50" width="460" height="900" fill="url(#yard-stripes)" clip-path="url(#field-clip)"/>
  </g>

  
  <g id="end-zones" fill="#173d5a" opacity="0.94">
    <rect x="145" y="50" width="460" height="75"/>
    <rect x="145" y="875" width="460" height="75"/>
    <path d="M145 50 L220 125 M195 50 L270 125 M245 50 L320 125 M295 50 L370 125              M345 50 L420 125 M395 50 L470 125 M445 50 L520 125 M495 50 L570 125 M545 50 L605 110" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.035"/>
    <path d="M145 875 L220 950 M195 875 L270 950 M245 875 L320 950 M295 875 L370 950              M345 875 L420 950 M395 875 L470 950 M445 875 L520 950 M495 875 L570 950 M545 875 L605 935" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.035"/>
  </g>

  
  <rect id="yard-tick-marks" x="145" y="125" width="460" height="750" fill="url(#yard-ticks)"/>

  
  <g id="field-markings" fill="none" stroke="#f7faf7" stroke-linecap="square">
    <rect x="145" y="50" width="460" height="900" stroke-width="5"/>

    
    <path d="M145 125 H605 M145 200 H605 M145 275 H605 M145 350 H605 M145 425 H605              M145 500 H605 M145 575 H605 M145 650 H605 M145 725 H605 M145 800 H605 M145 875 H605" stroke-width="4"/>

    
    <path d="M145 162.5 H605 M145 237.5 H605 M145 312.5 H605 M145 387.5 H605 M145 462.5 H605              M145 537.5 H605 M145 612.5 H605 M145 687.5 H605 M145 762.5 H605 M145 837.5 H605" stroke-width="2" opacity="0.58"/>
  </g>

  
  <g id="goalposts" fill="none" stroke="#f4cf3f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M345 20 V37 H405 V20 M375 37 V50"/>
    <path d="M345 980 V963 H405 V980 M375 963 V950"/>
  </g>
</svg>