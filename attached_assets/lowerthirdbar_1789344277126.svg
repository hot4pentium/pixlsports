  <g id="solid-bar">
    <path d="M52 49 H948 L990 91 V239 L949 281 H51 L10 239 V91 Z" fill="#02070d" stroke="#07101a" stroke-width="10"/>

    <path d="M58 54 H942 L983 95 V235 L944 276 H56 L17 237 V95 Z" fill="url(#outer-metal)" stroke="#263846" stroke-width="4"/>

