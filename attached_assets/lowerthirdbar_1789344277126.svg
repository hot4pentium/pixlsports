<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="600" viewBox="0 0 1000 300">
  <title>LeagueMatrix solid bar lower third</title>
  <desc id="description">A transparent, sport-neutral lower third built as one continuous beveled bar with subtle wraparound endcaps.</desc>

  <defs>
    <linearGradient id="outer-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9caab4"/>
      <stop offset="0.18" stop-color="#344553"/>
      <stop offset="0.5" stop-color="#d3dade"/>
      <stop offset="0.72" stop-color="#263641"/>
      <stop offset="1" stop-color="#84939d"/>
    </linearGradient>

    <linearGradient id="bar-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18324e"/>
      <stop offset="0.38" stop-color="#081523"/>
      <stop offset="0.72" stop-color="#0c2637"/>
      <stop offset="1" stop-color="#04131c"/>
    </linearGradient>

    <linearGradient id="inner-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152b43"/>
      <stop offset="0.2" stop-color="#091726"/>
      <stop offset="0.8" stop-color="#06121d"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>

    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4828"/>
      <stop offset="0.55" stop-color="#ff723f"/>
      <stop offset="1" stop-color="#ffad40"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1979ff"/>
      <stop offset="0.52" stop-color="#62c9ff"/>
      <stop offset="1" stop-color="#16d7c0"/>
    </linearGradient>

    

    
      
    

    
      
      
        
        
      
    
  </defs>

  

  
  <g id="wrap-folds">
