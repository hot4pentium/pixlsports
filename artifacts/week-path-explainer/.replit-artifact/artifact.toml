kind = "video"
videoAspectRatio = "16:9"
previewPath = "/week-path-explainer/"
title = "The Week Path"
description = "A short Pixl Sports video guiding site visitors through planning, following, and celebrating a game week."
version = "1.0.0"
id = "artifacts/week-path-explainer"
router = "path"

[[services]]
name = "web"
paths = [ "/week-path-explainer/" ]
localPort = 21382

[services.development]
run = "pnpm --filter @workspace/week-path-explainer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/week-path-explainer", "run", "build" ]
serve = "static"
publicDir = "artifacts/week-path-explainer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21382"
BASE_PATH = "/week-path-explainer/"
