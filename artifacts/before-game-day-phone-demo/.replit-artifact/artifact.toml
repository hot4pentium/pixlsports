kind = "video"
videoAspectRatio = "9:16"
previewPath = "/before-game-day-phone-demo/"
title = "Before Game Day"
description = "A short vertical Pixl Sports product demo showing a coach creating a game event and updating a game-day checklist on a phone."
version = "1.0.0"
id = "artifacts/before-game-day-phone-demo"
router = "path"

[[services]]
name = "web"
paths = [ "/before-game-day-phone-demo/" ]
localPort = 19497

[services.development]
run = "pnpm --filter @workspace/before-game-day-phone-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/before-game-day-phone-demo", "run", "build" ]
serve = "static"
publicDir = "artifacts/before-game-day-phone-demo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19497"
BASE_PATH = "/before-game-day-phone-demo/"
