<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LeagueMatrix Creative Studio</title>
    <meta name="description" content="LeagueMatrix Creative Studio — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="LeagueMatrix Creative Studio" />
    <meta property="og:description" content="LeagueMatrix Creative Studio — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LeagueMatrix Creative Studio" />
    <meta name="twitter:description" content="LeagueMatrix Creative Studio — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="app-boot-fallback" role="status" style="box-sizing:border-box;min-height:100vh;display:grid;place-items:center;padding:24px;background:#111317;color:#f5f7f4;font-family:Arial,sans-serif;text-align:center">
        <div style="max-width:420px">
          <div style="margin:0 auto 16px;width:14px;height:14px;border-radius:50%;background:#00e86b;box-shadow:0 0 24px #00e86b"></div>
          <strong style="display:block;font-size:20px;letter-spacing:.08em;text-transform:uppercase">Loading LeagueMatrix</strong>
          <p id="app-boot-message" style="margin:10px 0 0;color:#aeb5b0;font-size:14px;line-height:1.5">Connecting to the creative studio…</p>
          <button id="app-boot-retry" type="button" hidden style="margin-top:20px;border:0;background:#00e86b;color:#07110b;padding:12px 18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer">Reconnect preview</button>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const fallback = document.getElementById('app-boot-fallback');
        const message = document.getElementById('app-boot-message');
        const retry = document.getElementById('app-boot-retry');
        let booted = false;
        const showRetry = () => {
          if (booted || !fallback || !message || !retry) return;
          message.textContent = 'The preview did not finish connecting. Reconnect the preview and try again.';
          retry.hidden = false;
        };
        retry?.addEventListener('click', () => window.location.reload());
        window.addEventListener('leagueMatrix:booted', () => {
          booted = true;
          window.clearTimeout(timeout);
        }, { once: true });
        window.addEventListener('error', showRetry, { once: true });
        window.addEventListener('unhandledrejection', showRetry, { once: true });
        const timeout = window.setTimeout(showRetry, 7000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
