<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Pixl Sports Studio — Team graphics, schedules, and lineups</title>
    <meta name="description" content="Pixl Sports Studio helps teams create shareable graphics, schedules, rosters, and game-day lineups." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pixlsports.com/" />
    <meta property="og:title" content="Pixl Sports Studio" />
    <meta property="og:description" content="Create shareable team graphics, schedules, rosters, and game-day lineups with Pixl Sports Studio." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pixlsports.com/" />
    <meta property="og:image" content="https://pixlsports.com/pixlsports-logo.png" />
    <meta property="og:image:alt" content="Pixl Sports Studio logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pixl Sports Studio" />
    <meta name="twitter:description" content="Create shareable team graphics, schedules, rosters, and game-day lineups with Pixl Sports Studio." />
    <meta name="twitter:url" content="https://pixlsports.com/" />
    <meta name="twitter:image" content="https://pixlsports.com/pixlsports-logo.png" />
    <meta name="twitter:image:alt" content="Pixl Sports Studio logo" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%pwa-icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#00e86b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="192x192" href="%BASE_URL%pwa-icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (() => {
        if (window.location.hostname === 'www.pixlsports.com') {
          const canonicalUrl = new URL(window.location.href);
          canonicalUrl.hostname = 'pixlsports.com';
          window.location.replace(canonicalUrl.toString());
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-boot-fallback" role="status" style="box-sizing:border-box;min-height:100vh;display:grid;place-items:center;padding:24px;background:#111317;color:#f5f7f4;font-family:Arial,sans-serif;text-align:center">
        <div style="max-width:420px">
          <div style="margin:0 auto 16px;width:14px;height:14px;border-radius:50%;background:#00e86b;box-shadow:0 0 24px #00e86b"></div>
          <strong style="display:block;font-size:20px;letter-spacing:.08em;text-transform:uppercase">Loading Pixl Sports</strong>
          <p id="app-boot-message" style="margin:10px 0 0;color:#aeb5b0;font-size:14px;line-height:1.5">Connecting to the creative studio…</p>
          <button id="app-boot-retry" type="button" hidden style="margin-top:20px;border:0;background:#00e86b;color:#07110b;padding:12px 18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer">Reconnect preview</button>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const fallback = document.getElementById('app-boot-fallback');
        const message = document.getElementById('app-boot-message');
        const retry = document.getElementById('app-boot-retry');
        let booted = false;
        const showRetry = () => {
          if (booted || !fallback || !message || !retry) return;
          message.textContent = 'The preview did not finish connecting. Reconnect the preview and try again.';
          retry.hidden = false;
        };
        retry?.addEventListener('click', () => window.location.reload());
        window.addEventListener('leagueMatrix:booted', () => {
          booted = true;
          window.clearTimeout(timeout);
        }, { once: true });
        window.addEventListener('error', showRetry, { once: true });
        window.addEventListener('unhandledrejection', showRetry, { once: true });
        const timeout = window.setTimeout(showRetry, 7000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
